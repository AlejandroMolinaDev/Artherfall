name: build

on:
  push:
    paths-ignore:
      - '**.md'
      - 'presets/**.md'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  PLUGINVAL_VERSION: v1.0.4
  ARTEFACTS: build/Aetherfall_artefacts/Release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            pluginval: pluginval_Linux.zip
          - name: Windows
            os: windows-2022
            pluginval: pluginval_Windows.zip
          - name: macOS
            os: macos-14
            pluginval: pluginval_macOS.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb openbox \
            libasound2-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxcursor-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev \
            libgl1-mesa-dev

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: ccache
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.name }}
          max-size: 1G

      - name: Configure
        shell: bash
        run: |
          EXTRA=()
          if [ "$RUNNER_OS" != "Windows" ]; then
            EXTRA+=(-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
          fi
          if [ "$RUNNER_OS" == "macOS" ]; then
            EXTRA+=("-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64")
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DAETHERFALL_BUILD_CLAP=ON "${EXTRA[@]}"

      - name: Build
        shell: bash
        run: cmake --build build --config $BUILD_TYPE --parallel 4

      - name: Unit tests + DAW-style host tests (real VST3 binary)
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            # Virtual display + window manager so the editor test can open real windows.
            Xvfb :99 -screen 0 1920x1200x24 &
            sleep 1
            export DISPLAY=:99
            openbox &
            sleep 1
          fi
          ctest --test-dir build -C $BUILD_TYPE --output-on-failure

      - name: Ad-hoc code signing (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign --force --deep -s - "$ARTEFACTS/VST3/AETHERFALL.vst3"
          codesign --force --deep -s - "$ARTEFACTS/AU/AETHERFALL.component"
          codesign --force --deep -s - "$ARTEFACTS/Standalone/AETHERFALL.app"

      - name: pluginval (VST3, strictness 10)
        shell: bash
        run: |
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/${{ matrix.pluginval }}"
          if [ "$RUNNER_OS" == "Windows" ]; then
            7z x -y -opluginval pluginval.zip > /dev/null
          else
            unzip -q -o pluginval.zip -d pluginval
          fi
          case "$RUNNER_OS" in
            Linux)   PV=./pluginval/pluginval; chmod +x "$PV"; RUN="xvfb-run -a" ;;
            macOS)   PV=./pluginval/pluginval.app/Contents/MacOS/pluginval; chmod +x "$PV"; RUN="" ;;
            Windows) PV=./pluginval/pluginval.exe; RUN="" ;;
          esac
          $RUN "$PV" --strictness-level 10 --verbose --validate-in-process \
                     --timeout-ms 900000 --output-dir pluginval-logs \
                     "$ARTEFACTS/VST3/AETHERFALL.vst3"

      - name: auval (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$ARTEFACTS/AU/AETHERFALL.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 2
          auval -a | grep -i aetherfall || true
          auval -strict -v aumf Afx1 Aefl

      - name: Upload pluginval logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pluginval-logs-${{ matrix.name }}
          path: pluginval-logs
          if-no-files-found: ignore

      - name: Upload plug-ins
        uses: actions/upload-artifact@v4
        with:
          name: AETHERFALL-${{ matrix.name }}
          path: |
            ${{ env.ARTEFACTS }}/VST3
            ${{ env.ARTEFACTS }}/AU
            ${{ env.ARTEFACTS }}/CLAP
            ${{ env.ARTEFACTS }}/Standalone
          if-no-files-found: warn
